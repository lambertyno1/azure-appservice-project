name: CI/CD Pipeline

on:
  push:
    branches: [ main ]

env:
  ACR_NAME: acrprojectapp.azurecr.io
  APP_NAME: web-app-project
  RESOURCE_GROUP: rg-project-app

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Tests
        run: echo "Running automated tests..."

  build-and-push:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Login to ACR
        uses: azure/docker-login@v1
        with:
          login-server: ${{ env.ACR_NAME }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - name: Build and push Docker image
        run: |
          docker build -t ${{ env.ACR_NAME }}/app:${{ github.sha }} .
          docker push ${{ env.ACR_NAME }}/app:${{ github.sha }}

  deploy-staging:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Staging Slot
        run: |
          az webapp config container set \
            --name ${{ env.APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --slot staging \
            --docker-custom-image-name ${{ env.ACR_NAME }}/app:${{ github.sha }} \
            --docker-registry-server-url https://${{ env.ACR_NAME }} \
            --docker-registry-server-user ${{ secrets.ACR_USERNAME }} \
            --docker-registry-server-password ${{ secrets.ACR_PASSWORD }}

      - name: Health Check
        run: |
          HOST=$(az webapp show -g ${{ env.RESOURCE_GROUP }} -n ${{ env.APP_NAME }} --slot staging --query defaultHostName -o tsv)
          for i in $(seq 1 15); do
            curl -sf https://$HOST/health && exit 0
            echo "Not ready yet (attempt $i), waiting 15s..."
            sleep 15
          done
          echo "Staging never became healthy"
          exit 1

  swap-to-production:
    needs: deploy-staging
    runs-on: ubuntu-latest
    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Swap Staging to Production
        uses: azure/cli@v2
        with:
          inlineScript: |
            az webapp deployment slot swap --name ${{ env.APP_NAME }} --resource-group ${{ env.RESOURCE_GROUP }} --slot staging --target-slot production
