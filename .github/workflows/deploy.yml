name: CI/CD Pipeline

on:
  push:
    branches: [ main ]

env:
  # UPDATE THESE TO MATCH YOUR EXACT AZURE RESOURCES
env:
  ACR_NAME: acrprojectapp.azurecr.io  <-- Must include .azurecr.io
  APP_NAME: web-app-project-dkajc3bkacggg8dw
  RESOURCE_GROUP: rg-project-app

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Run Tests
        run: echo "Running automated tests..."

  build-and-push:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Login to ACR
        uses: azure/docker-login@v1
        with:
          login-server: ${{ env.ACR_NAME }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - name: Build and push Docker image
        run: |
          docker build -t ${{ env.ACR_NAME }}/app:${{ github.sha }} .
          docker push ${{ env.ACR_NAME }}/app:${{ github.sha }}

  deploy-staging:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Staging Slot
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ env.APP_NAME }}
          slot-name: staging
          publish-profile: ${{ secrets.AZURE_PUBLISH_PROFILE }}
          images: '${{ env.ACR_NAME }}/app:${{ github.sha }}'
      - name: Health Check
        run: |
          sleep 30
          curl -f https://${{ env.APP_NAME }}-staging.azurewebsites.net/health || exit 1

  swap-to-production:
    needs: deploy-staging
    runs-on: ubuntu-latest
    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_PUBLISH_PROFILE }}
      - name: Swap Staging to Production
        uses: azure/cli@v2
        with:
          inlineScript: |
            az webapp deployment slot swap --name ${{ env.APP_NAME }} --resource-group ${{ env.RESOURCE_GROUP }} --slot staging --target-slot production
