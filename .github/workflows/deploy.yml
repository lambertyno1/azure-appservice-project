# =============================================================================
# WORKFLOW NAME: Displays on the GitHub Actions tab of the repository.
# =============================================================================
name: CI/CD Pipeline

# =============================================================================
# TRIGGERS: Defines the events that cause this workflow to start running.
# =============================================================================
on:
# Triggers the workflow when code is pushed to these specific branches
  push:
    branches: [ main ]
# Runs the test job on pull requests into main (deploy jobs are skipped)
  pull_request:
    branches: [ main ]
# Allows the workflow to be started manually from the Actions tab
  workflow_dispatch:

env:
  ACR_NAME: acrprojectapp.azurecr.io
  APP_NAME: web-app-project
  RESOURCE_GROUP: rg-project-app

# =============================================================================
# JOBS: The core automation tasks. Jobs run in parallel by as defined.
# =============================================================================
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Use Node 18 so the tests run on the same version as the Dockerfile
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
      # Installs the same way the Dockerfile does (npm install, ignoring the lock file)
      - name: Install dependencies
        run: npm install --no-package-lock
      # Runs the Jest tests in the tests folder. A failure stops the pipeline.
      - name: Run Tests
        run: npm test

  build-and-push:
    needs: build-and-test
    # Only build and push when the code is on main, not for pull requests
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Login to ACR
        uses: azure/docker-login@v1
        with:
          login-server: ${{ env.ACR_NAME }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - name: Build and push Docker image
        run: |
          docker build -t ${{ env.ACR_NAME }}/app:${{ github.sha }} .
          docker push ${{ env.ACR_NAME }}/app:${{ github.sha }}

  deploy-staging:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Staging Slot
        run: |
          az webapp config container set \
            --name ${{ env.APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --slot staging \
            --docker-custom-image-name ${{ env.ACR_NAME }}/app:${{ github.sha }} \
            --docker-registry-server-url https://${{ env.ACR_NAME }} \
            --docker-registry-server-user ${{ secrets.ACR_USERNAME }} \
            --docker-registry-server-password ${{ secrets.ACR_PASSWORD }}

      - name: Health Check
        run: |
          HOST=$(az webapp show -g ${{ env.RESOURCE_GROUP }} -n ${{ env.APP_NAME }} --slot staging --query defaultHostName -o tsv)
          for i in $(seq 1 15); do
            curl -sf https://$HOST/health && exit 0
            echo "Not ready yet (attempt $i), waiting 15s..."
            sleep 15
          done
          echo "Staging never became healthy"
          exit 1

  swap-to-production:
    needs: deploy-staging
    runs-on: ubuntu-latest
    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Swap Staging to Production
        uses: azure/cli@v2
        with:
          inlineScript: |
            az webapp deployment slot swap --name ${{ env.APP_NAME }} --resource-group ${{ env.RESOURCE_GROUP }} --slot staging --target-slot production
